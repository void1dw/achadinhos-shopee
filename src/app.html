<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<script async src="https://www.googletagmanager.com/gtag/js?id=G-LE7LEHM879"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			// Official GA4 opt-out flag, evaluated at send time, so it is kept in sync with the
			// current path before every navigation (including client-side history changes).
			(function () {
				var flag = 'ga-disable-G-LE7LEHM879';
				var isAdmin = function (pathname) {
					return pathname === '/admin' || pathname.indexOf('/admin/') === 0;
				};
				// Não chamamos gtag('config') ao sair do admin: o GA4 já foi configurado no carregamento
				// e o gtag.js emite o page_view das mudanças de histórico. Reconfigurar duplicaria o page_view.
				var sync = function (url) {
					var path;
					try {
						path = url ? new URL(url, location.href).pathname : location.pathname;
					} catch (e) {
						path = location.pathname;
					}
					if (isAdmin(path)) {
						window[flag] = true;
					} else {
						try {
							delete window[flag];
						} catch (e) {
							window[flag] = false;
						}
					}
				};
				['pushState', 'replaceState'].forEach(function (method) {
					var original = history[method];
					history[method] = function (state, title, url) {
						var result = original.apply(this, arguments);
						sync(url);
						return result;
					};
				});
				window.addEventListener('popstate', function () {
					sync();
				});
				sync();
			})();
			gtag('js', new Date());
			gtag('config', 'G-LE7LEHM879');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
